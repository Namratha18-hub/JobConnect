spring.application.name=jobconnect-backend

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/jobconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=NewRoot@2026#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# JWT Configuration
# ===============================
jwt.secret=JobConnectJwtSecretKeyForDevelopmentOnlyChangeThisToAStrongSecret123456789
jwt.expiration=86400000

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# ADZUNA EXTERNAL INTERNSHIP FEED
# ============================================================

# Enable automatic external internship synchronization
adzuna.enabled=true

# Credentials are read from PowerShell environment variables
# Do NOT put the actual APP ID / APP KEY directly in this file
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}

# Adzuna API configuration
adzuna.base-url=https://api.adzuna.com/v1/api
adzuna.country=in

# Number of listings requested per search
adzuna.results-per-page=30

# First synchronization:
# 30 seconds after Spring Boot starts
adzuna.initial-delay-ms=30000

# Automatic refresh:
# every 24 hours
adzuna.refresh-delay-ms=86400000
# ==========================================
# JOBCONNECT EMAIL CONFIGURATION
# ==========================================

jobconnect.email.enabled=${MAIL_ENABLED:false}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

jobconnect.frontend.url=http://localhost:5173
jobconnect.password-reset.log-link=${RESET_LINK_LOGGING:false}